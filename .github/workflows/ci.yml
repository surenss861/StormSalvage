name: CI

on:
  push:
    branches: [main, v3-art-direction, v4-gameplay]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Rojo needs the place's .rbxm models (LFS); the Blender/FBX sources aren't fetched.
      - name: Fetch Roblox models from LFS
        run: git lfs pull --include "assets/roblox/**"
      - uses: CompeyDev/setup-rokit@v0.1.2
      - name: Static checks and build
        run: tools/ci/check.sh
      - name: Unit tests
        run: lune run tests/run
